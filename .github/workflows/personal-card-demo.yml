name: Personal card Sedrava website
on:
  push:
    branches:
      - demo/personal-card-site
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile personal site from Sedrava
        run: python -m sedrava_cli build site examples/personal_card_site.sdr --output build/personal-card
      - name: Verify generated output
        run: |
          test -s build/personal-card/index.html
          test -s build/personal-card/site.css
          test -s build/personal-card/sedrava-site.json
          grep -q 'Создаю вещи' build/personal-card/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-card-sedrava-site
          if-no-files-found: error
          path: build/personal-card/
