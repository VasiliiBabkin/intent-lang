name: Android proof of concept
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python -m unittest discover -s tests -v
      - run: python android_codegen.py examples/counter.intent --output build/generated-android
      - name: Build debug APK
        working-directory: build/generated-android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: intent-demo-debug-apk
          path: build/generated-android/app/build/outputs/apk/debug/app-debug.apk
