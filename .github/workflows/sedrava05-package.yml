name: Sedrava 0.5 package validation
on:
  push:
    branches:
      - feature/sedrava-0.5-cli-package
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q sedrava_core.py sedrava_cli.py web_codegen.py android_codegen_v03.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install package
        run: python -m pip install .
      - name: Verify installed CLI
        run: sedrava --version
      - name: Verify program
        run: sedrava test examples/workflow.sdr
      - name: Build web application
        run: sedrava build web examples/workflow.sdr --output build/web/index.html
      - name: Build distributable archives
        run: |
          python -m pip install build
          python -m build
      - name: Validate distributions
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: sedrava-05-python-distributions
          path: dist/*
          if-no-files-found: error
