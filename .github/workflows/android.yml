name: Android proof of concept
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android command-line tools missing: $SDK/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile-check Python sources
        run: python -m compileall -q sedrava.py android_codegen.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - run: python android_codegen.py examples/counter.sdr --output build/generated-android
      - name: Build debug APK
        working-directory: build/generated-android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sedrava-demo-debug-apk
          if-no-files-found: error
          path: build/generated-android/app/build/outputs/apk/debug/app-debug.apk
