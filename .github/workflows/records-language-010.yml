name: Records language 0.10 Android and UI
on:
  push:
    branches: [feature/010-records-collections-spec]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate untouched application and oracle tests
        run: |
          python -m sedrava_cli check examples/task_manager.sdr
          python -m sedrava_cli test examples/task_manager.sdr
          python -m sedrava_cli build web examples/task_manager.sdr --output build/tasks-web/index.html
          python -m sedrava_cli build android examples/task_manager.sdr --output build/tasks-android
          python scripts/prepare_records_android_tests.py build/tasks-android
          python scripts/prepare_records_ui_tests.py build/tasks-android
      - name: APK, JVM conformance, Lint and instrumentation compilation
        run: gradle -p build/tasks-android --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Generic record types, int32 fields and nested capacity conformance
        run: |
          python -m sedrava_cli build android tests/fixtures/records_generic.sdr --output build/generic-android
          python scripts/prepare_records_android_tests.py build/generic-android --source tests/fixtures/records_generic.sdr
          gradle -p build/generic-android --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compose interactions and activity recreation on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/test_records_emulator.sh
      - name: Verify APK
        run: python scripts/verify_apk.py build/tasks-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sedrava-records-task-manager-apk-web-evidence
          path: |
            build/tasks-android/app/build/outputs/apk
            build/tasks-android/app/build/reports
            build/tasks-android/app/build/test-results
            build/tasks-android/app/build/outputs/androidTest-results
            build/tasks-android/app/src
            build/tasks-web
            build/tasks-preferences.xml
            build/tasks-relaunch.*
            build/generic-android/app/build/outputs/apk
            build/generic-android/app/build/reports/tests
          if-no-files-found: error
