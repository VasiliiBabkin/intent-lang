name: Audit historical Sedrava alpha assets (no publication)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub prerelease tag
        required: true
        default: v0.9.0a1
      checked_sha:
        description: Exact commit already verified by CI
        required: true
        default: 261ed75a42aafbae8186891a6f3f920d220b58c0
      reference_run:
        description: Successful reference APK workflow run for checked_sha
        required: true
        default: '40893365635'
      alpha_run:
        description: Successful alpha checks workflow run for checked_sha
        required: true
        default: '40893365715'

permissions:
  contents: read
  actions: read

concurrency:
  group: sedrava-release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tag, release and successful source runs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.checked_sha }}
          REFERENCE_RUN: ${{ inputs.reference_run }}
          ALPHA_RUN: ${{ inputs.alpha_run }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TAG" = "v0.9.0a1" || { echo "This workflow only supports the audited v0.9.0a1 release"; exit 1; }
          test "$SHA" = "261ed75a42aafbae8186891a6f3f920d220b58c0" || { echo "Unexpected release commit"; exit 1; }
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$SHA" || { echo "Tag does not point at verified SHA"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft -q '.isPrerelease and (.isDraft | not)' | grep -qx true
          for run in "$REFERENCE_RUN" "$ALPHA_RUN"; do
            actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha')"
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')"
            test "$actual_sha" = "$SHA" && test "$conclusion" = success || { echo "Run $run is not a passing run for $SHA"; exit 1; }
          done
      - name: Download tested candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_RUN: ${{ inputs.reference_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$REFERENCE_RUN" --repo "$GITHUB_REPOSITORY" --name sedrava-09-release-candidate-bundle --dir release-assets
          cd release-assets
          test -f SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test -s app-debug.apk && test -s web-examples.zip
          python - <<'PY'
          from pathlib import Path
          expected = {line.split('  ', 1)[1] for line in Path('SHA256SUMS').read_text().splitlines()}
          actual = {p.name for p in Path('.').iterdir() if p.is_file() and p.name != 'SHA256SUMS'}
          assert actual == expected, (actual, expected)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: historical-09-audited-assets
          path: release-assets/*
          if-no-files-found: error
