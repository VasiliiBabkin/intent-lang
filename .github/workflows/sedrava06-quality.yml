name: Sedrava 0.6 cross-runtime and package checks
on:
  push:
    branches: [feature/sedrava-0.6-quality]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Unit and differential tests
        run: python -m unittest discover -s tests -v
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
        if: runner.os != 'Windows'
      - name: Build and install wheel (Windows)
        run: |
          python -m pip install build
          python -m build
          python -m pip install (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
        if: runner.os == 'Windows'
      - name: Smoke test
        run: |
          sedrava --version
          sedrava check examples/workflow.sdr
          sedrava test examples/workflow.sdr
          sedrava build web examples/workflow.sdr --output build/web/index.html
      - name: Validate metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
        if: runner.os != 'Windows'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        with:
          name: sedrava-06-testpypi-candidate
          path: dist/*
