name: Collection core 0.10

on:
  push:
    branches: [feature/010-records-collections-spec]
  pull_request:
    paths:
      - 'sedrava_collections.py'
      - 'tests/test_collections_010.py'
      - '.github/workflows/collections-010.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_collections_010.py -v
