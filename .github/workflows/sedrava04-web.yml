name: Sedrava 0.4 web validation
on:
  push:
    branches:
      - feature/sedrava-0.4-web-docs
  workflow_dispatch:
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile-check Python
        run: python -m compileall -q sedrava_core.py web_codegen.py tests
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Generate standalone web app
        run: python web_codegen.py examples/workflow.sdr --output build/web/index.html
      - name: Verify output exists
        run: test -s build/web/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-04-web
          if-no-files-found: error
          path: build/web/index.html
