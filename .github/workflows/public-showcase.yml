name: Sedrava public showcase demo
on:
  push:
    branches:
      - demo/sedrava-public-showcase
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile actual Sedrava source
        run: python -m sedrava_cli build site examples/sedrava_public_showcase.sdr --output build/showcase
      - name: Check output
        run: |
          test -s build/showcase/index.html
          test -s build/showcase/site.css
          test -s build/showcase/assets/*.svg
          grep -q 'От идеи' build/showcase/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-public-showcase
          if-no-files-found: error
          path: build/showcase/
