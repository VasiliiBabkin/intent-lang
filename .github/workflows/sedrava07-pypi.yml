name: Sedrava distribution verification (no publishing)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test, build and audit
        run: |
          python -m unittest discover -s tests -v
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
      - name: Clean wheel installation and CLI smoke test
        shell: bash
        run: |
          python -m venv /tmp/sedrava-clean
          /tmp/sedrava-clean/bin/python -m pip install dist/*.whl
          /tmp/sedrava-clean/bin/sedrava --version
          /tmp/sedrava-clean/bin/sedrava check examples/workflow.sdr
          /tmp/sedrava-clean/bin/sedrava test examples/workflow.sdr
          /tmp/sedrava-clean/bin/sedrava build web examples/workflow.sdr --output /tmp/sedrava-clean/index.html
          /tmp/sedrava-clean/bin/sedrava build android examples/workflow.sdr --output /tmp/sedrava-clean/android
