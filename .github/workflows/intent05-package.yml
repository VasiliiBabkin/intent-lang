name: Intent 0.5 package validation
on:
  push:
    branches:
      - feature/intent-0.5-cli-package
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q intent_core.py intent_cli.py web_codegen.py android_codegen_v03.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install package
        run: python -m pip install .
      - name: Verify installed CLI
        run: intent --version
      - name: Verify program
        run: intent test examples/workflow.intent
      - name: Build web application
        run: intent build web examples/workflow.intent --output build/web/index.html
      - name: Build distributable archives
        run: |
          python -m pip install build
          python -m build
      - name: Validate distributions
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: intent-05-python-distributions
          path: dist/*
          if-no-files-found: error
