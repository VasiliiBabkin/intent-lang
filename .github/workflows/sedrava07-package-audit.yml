name: Sedrava packaging and provenance audit
on:
  push:
    branches: [feature/sedrava-0.7-testpypi-prep]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Inspect archives and metadata
        run: python scripts/audit_dist.py
      - name: Install distribution and smoke test
        shell: bash
        run: |
          python -m venv /tmp/sedrava-dist-smoke
          /tmp/sedrava-dist-smoke/bin/python -m pip install dist/*.whl
          /tmp/sedrava-dist-smoke/bin/sedrava --version
          /tmp/sedrava-dist-smoke/bin/sedrava check examples/workflow.sdr
          /tmp/sedrava-dist-smoke/bin/sedrava test examples/workflow.sdr
          /tmp/sedrava-dist-smoke/bin/sedrava build web examples/workflow.sdr --output /tmp/sedrava-dist-smoke/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-07-audited-dist
          path: dist/*
          if-no-files-found: error
