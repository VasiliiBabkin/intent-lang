name: Sedrava 0.9 reference Android APK
on:
  push:
    paths:
      - "examples/reference_09.sdr"
      - "android_codegen.py"
      - "android_codegen_v03.py"
      - "sedrava_core.py"
      - "tests/test_reference_09.py"
      - ".github/workflows/reference-09-android.yml"
  pull_request:
  workflow_dispatch:
jobs:
  reference-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check reference semantics
        run: |
          python -m unittest discover -s tests -p test_reference_09.py -v
          python sedrava_cli.py test examples/reference_09.sdr
      - name: Generate reference Android project
        run: python android_codegen_v03.py examples/reference_09.sdr --output build/reference-09-android
      - name: Prepare reference JVM state-validation tests
        run: python scripts/prepare_android_tests.py build/reference-09-android
      - name: Build reference APK
        working-directory: build/reference-09-android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify APK signature and permissions
        run: python scripts/verify_apk.py build/reference-09-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Package checked candidate artifacts (no publication)
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
          python scripts/prepare_release.py --apk build/reference-09-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sedrava-09-release-candidate-bundle
          if-no-files-found: error
          path: build/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: sedrava-09-reference-debug-apk
          if-no-files-found: error
          path: build/reference-09-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sedrava-09-android-lint-and-source
          if-no-files-found: error
          path: |
            build/reference-09-android/app/build/reports/lint-results-debug.*
            build/reference-09-android/app/build/reports/tests
            build/reference-09-android/app/build/test-results
            build/reference-09-android/app/src
            build/reference-09-android/*.kts
            build/reference-09-android/app/*.kts
