name: Navigation 0.10 Android and UI
on:
  push:
    branches: [feature/010-multiscreen-navigation, feature/010-release-readiness]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Generate untouched application and oracle tests
        run: |
          python -m sedrava_cli check examples/task_manager_navigation.sdr
          python -m sedrava_cli test examples/task_manager_navigation.sdr
          python -m sedrava_cli build web examples/task_manager_navigation.sdr --output build/navigation-web/index.html
          python -m sedrava_cli build android examples/task_manager_navigation.sdr --output build/navigation-android
          python scripts/prepare_navigation_android_tests.py build/navigation-android
          python scripts/prepare_navigation_ui_tests.py build/navigation-android
      - name: APK, JVM conformance, Lint and instrumentation compilation
        run: gradle -p build/navigation-android --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Navigation without records or domain state
        run: |
          python -m sedrava_cli build android tests/fixtures/navigation_pages.sdr --output build/navigation-pages
          python scripts/prepare_navigation_android_tests.py build/navigation-pages --source tests/fixtures/navigation_pages.sdr
          gradle -p build/navigation-pages --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Scalar/text navigation and compiler-marker literals
        run: |
          python -m sedrava_cli build android tests/fixtures/navigation_scalar.sdr --output build/navigation-scalar --application-id com.example.sedrava.scalar
          python scripts/prepare_navigation_android_tests.py build/navigation-scalar --source tests/fixtures/navigation_scalar.sdr
          python scripts/prepare_navigation_ui_tests.py build/navigation-scalar --scalar
          gradle -p build/navigation-scalar --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Independent second app APK, JVM, Lint and UI harness
        run: |
          python -m sedrava_cli build android examples/task_manager.sdr --output build/tasks-android
          python scripts/prepare_records_android_tests.py build/tasks-android
          python scripts/prepare_records_ui_tests.py build/tasks-android
          gradle -p build/tasks-android --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Build immutable pre-RC baseline for real update test
        run: |
          git worktree add --detach build/rc-baseline-src 2ff3994dd503d453c2fc81c133cc1c95a9c3d3b1
          python build/rc-baseline-src/sedrava_cli.py build android build/rc-baseline-src/examples/task_manager_navigation.sdr --output build/navigation-baseline
          python scripts/prepare_navigation_ui_tests.py build/navigation-baseline --seed-upgrade
          gradle -p build/navigation-baseline --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          python scripts/record_rc_tools.py build/rc-android-tools.json --android
          gradle -p build/navigation-android --no-daemon :app:dependencies --configuration debugRuntimeClasspath > build/rc-android-dependencies.txt
      - name: Rebuild immutable rc1 source for same-key update verification
        run: |
          git worktree add --detach build/rc1-baseline-src 6ddae99fc837d67b465285f629d9f5a2ec52e870
          python build/rc1-baseline-src/sedrava_cli.py build android examples/task_manager_navigation.sdr --output build/navigation-rc1-baseline
          python scripts/prepare_navigation_ui_tests.py build/navigation-rc1-baseline --seed-upgrade
          gradle -p build/navigation-rc1-baseline --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compose interactions and activity recreation on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python scripts/test_rc_upgrade.py
            python scripts/test_rc_upgrade.py --baseline-project build/navigation-rc1-baseline --baseline-source build/rc1-baseline-src --baseline-sha 6ddae99fc837d67b465285f629d9f5a2ec52e870 --baseline-version 0.10.0rc1 --baseline-code 10001 --evidence-prefix build/rc1-audit-upgrade
            bash scripts/test_navigation_emulator.sh
            gradle -p build/navigation-scalar --no-daemon :app:connectedDebugAndroidTest
            bash scripts/test_records_emulator.sh
            bash scripts/test_side_by_side.sh
      - name: Verify APK
        run: |
          python scripts/verify_apk.py build/navigation-android/app/build/outputs/apk/debug/app-debug.apk
          python scripts/verify_apk.py build/tasks-android/app/build/outputs/apk/debug/app-debug.apk
          python scripts/verify_apk.py build/navigation-scalar/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build/navigation-android/app/build/outputs/apk/debug/app-debug.apk build/tasks-android/app/build/outputs/apk/debug/app-debug.apk build/navigation-web/index.html > build/readiness-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sedrava-navigation-apk-web-evidence
          path: |
            build/navigation-android/app/build/outputs/apk
            build/navigation-android/app/build/reports
            build/navigation-android/app/build/test-results
            build/navigation-android/app/build/outputs/androidTest-results
            build/navigation-android/app/src
            build/navigation-android/sedrava-android.json
            build/tasks-android/sedrava-android.json
            build/tasks-android/app/build/outputs/apk
            build/tasks-android/app/build/reports
            build/tasks-android/app/build/outputs/androidTest-results
            build/tasks-android/app/build/test-results
            build/side-by-side-*
            build/tasks-relaunch.*
            build/tasks-preferences.xml
            build/navigation-web
            build/readiness-SHA256SUMS
            build/navigation-scalar/sedrava-android.json
            build/navigation-scalar/app/build/outputs/apk
            build/navigation-scalar/app/build/outputs/androidTest-results
            build/navigation-scalar/app/build/test-results
            build/navigation-scalar/app/build/reports/tests
            build/navigation-pages/app/build/test-results
            build/navigation-pages/app/build/reports/tests
            build/rc1-audit-upgrade*
            build/navigation-rc1-baseline/app/build/outputs/androidTest-results
            build/rc-upgrade*
            build/rc-android-tools.json
            build/rc-android-dependencies.txt
            build/navigation-baseline/app/build/outputs/androidTest-results
            build/navigation-failure.*
            build/navigation-font-scale.txt
            build/navigation-preferences.xml
            build/navigation-relaunch.*
          if-no-files-found: error
