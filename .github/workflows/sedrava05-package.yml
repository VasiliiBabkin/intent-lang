name: Sedrava 0.5 package validation
on:
  push:
    branches:
      - feature/sedrava-0.5-cli-package
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q sedrava_core.py sedrava_cli.py web_codegen.py android_codegen_v03.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install package
        run: python -m pip install .
      - name: Verify installed CLI
        run: sedrava --version
      - name: Verify program
        run: sedrava test examples/workflow.sdr
      - name: Build web application
        run: sedrava build web examples/workflow.sdr --output build/web/index.html
      - name: Build distributable archives
        run: |
          python -m pip install build
          python -m build
      - name: Validate distributions
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: sedrava-05-python-distributions
          path: dist/*
          if-no-files-found: error
