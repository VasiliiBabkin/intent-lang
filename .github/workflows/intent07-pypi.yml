name: Publish Intent to PyPI (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and audit distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python scripts/audit_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: intent-pypi-0.7.0a1
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/intent-lng/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: intent-pypi-0.7.0a1
          path: dist
      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.13.0
