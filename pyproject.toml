[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sedrava"
version = "0.7.0a1"
description = "Sedrava Programming Language: experimental declarative language for applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Sedrava contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
sedrava = "sedrava_cli:main"

[tool.setuptools]
py-modules = ["sedrava", "sedrava_core", "sedrava_cli", "android_codegen", "android_codegen_v03", "web_codegen"]
