[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sedrava"
version = "0.10.0.dev0"
description = "Sedrava Programming Language: experimental declarative language for applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Sedrava contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/VasiliiBabkin/sedrava"
Documentation = "https://github.com/VasiliiBabkin/sedrava/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/VasiliiBabkin/sedrava/issues"

[project.scripts]
sedrava = "sedrava_cli:main"

[tool.setuptools]
py-modules = ["sedrava", "sedrava_core", "sedrava_cli", "android_codegen", "android_codegen_v03", "web_codegen"]
